<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roadrunner Reading Calendar</title><link rel="stylesheet" href="style.css"></head>
<body><header class="app-header"><div><span class="eyebrow">ROADRUNNER • FAMILY READING</span><h1>A new month. A new reading adventure.</h1><p>Create a calendar for every family in English, Español & 简体中文.</p></div><button id="print">Print / Save PDF</button></header>
<main><section class="controls" aria-label="Calendar settings"><label>Month<select id="month"></select></label><label>Year<input id="year" type="number" min="1900" max="2100" value="2026"></label><label>Design<select id="design"><option value="classic">01 · Original layout</option><option value="roomy">02 · More room for languages</option></select></label><p id="design-description"></p></section>
<section class="workspace"><aside class="editor"><span class="eyebrow">MAKE IT YOURS</span><h2>Monthly notes</h2><p>Dates update automatically. School events are added by you.</p><form id="event-form"><label>Day<input id="event-day" type="number" min="1" required value="1"></label><label>English<input id="event-en" required placeholder="Book delivery!"></label><label>Español<input id="event-es" placeholder="¡Entrega de libros!"></label><label>简体中文<input id="event-zh" placeholder="图书发放！"></label><button type="submit">Add / update note</button></form><div id="event-list"></div><details><summary>Reading goals</summary><label>TK–1st grade (minutes)<input class="goal-input" data-index="0" type="number" min="0" value="250"></label><label>2nd–3rd grade (minutes)<input class="goal-input" data-index="1" type="number" min="0" value="450"></label><label>4th–5th grade (minutes)<input class="goal-input" data-index="2" type="number" min="0" value="650"></label></details><p class="save-note" id="save-status">Your settings save automatically in this browser.</p></aside><div class="preview-wrap"><article id="calendar" aria-label="Printable reading calendar"></article></div></section></main><script type="module" src="app.js"></script></body></html>
